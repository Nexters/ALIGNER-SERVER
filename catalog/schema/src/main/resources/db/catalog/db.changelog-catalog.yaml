# catalog 도메인 changelog.
#
# changeset id 에 도메인 접두사를 붙인다. 도메인 5 개가 public.DATABASECHANGELOG 하나를
# 공유하므로 접두사가 없으면 번호가 겹친다 (docs/architecture.md §6).
#
# 이미 적용된 changeset 은 수정하지 않고 새로 쌓는다.
#
# 순서가 FK 를 따른다. pose_muscle 은 target_pose·muscle 뒤, exercise_muscle 과
# exercise_voice_cue 는 exercise 뒤여야 한다.
databaseChangeLog:
  - changeSet:
      id: catalog-0001-create-schema
      author: aligner
      comment: catalog 스키마 생성
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS catalog

  - changeSet:
      id: catalog-0002-create-exercise
      author: aligner
      comment: 보강 운동 테이블 생성
      changes:
        - sqlFile:
            path: ddl/001-create-exercise.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0003-create-target-pose
      author: aligner
      comment: 목표 자세 테이블 생성
      changes:
        - sqlFile:
            path: ddl/002-create-target-pose.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0004-create-muscle
      author: aligner
      comment: 근육 마스터 테이블 생성
      changes:
        - sqlFile:
            path: ddl/003-create-muscle.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0005-create-pose-muscle
      author: aligner
      comment: 목표 자세와 근육 매핑 테이블 생성
      changes:
        - sqlFile:
            path: ddl/004-create-pose-muscle.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0006-create-exercise-muscle
      author: aligner
      comment: 보강 운동과 근육 매핑 테이블 생성
      changes:
        - sqlFile:
            path: ddl/005-create-exercise-muscle.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0007-create-exercise-voice-cue
      author: aligner
      comment: 음성 큐잉 대본 테이블 생성
      changes:
        - sqlFile:
            path: ddl/006-create-exercise-voice-cue.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0008-split-muscle-highlight-and-add-exercise-category
      author: aligner
      comment: 근육맵 하이라이트를 앞·뒤로 분리하고 운동 분류 추가
      changes:
        - sqlFile:
            path: ddl/007-split-muscle-highlight-and-add-exercise-category.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0009-add-exercise-media
      author: aligner
      comment: 운동에 이미지 자산 키와 영상 URL 추가
      changes:
        - sqlFile:
            path: ddl/008-add-exercise-media.sql
            relativeToChangelogFile: true

  # 여기부터 seed 다. DDL 과 달리 감수로 값이 바뀌므로 rollback 을 붙인다 — 개발 DB 에서
  # 되돌리고 다시 쌓는 일이 잦다. 이미 적용된 changeset 은 고치지 않고 UPDATE 를 새로 쌓는다.
  - changeSet:
      id: catalog-0010-seed-target-pose
      author: aligner
      comment: 핀포즈 9 개 적재
      changes:
        - sqlFile:
            path: seed/001-target-pose.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM catalog.target_pose WHERE target_pose_id BETWEEN 1 AND 9

  - changeSet:
      id: catalog-0011-seed-exercise
      author: aligner
      comment: 루틴에 배치된 자세 29 개의 운동 행 적재
      changes:
        - sqlFile:
            path: seed/002-exercise.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM catalog.exercise WHERE exercise_id BETWEEN 101 AND 129

  # 여기부터 YMove 연동이다. DDL 과 seed 를 나눠 쌓는다 — 컬럼은 스키마이고 값은 감수 대상이라
  # 되돌리는 단위가 다르다.
  - changeSet:
      id: catalog-0012-add-exercise-thumbnail-url
      author: aligner
      comment: 운동에 영상 썸네일 URL 컬럼 추가
      changes:
        - sqlFile:
            path: ddl/009-add-exercise-thumbnail-url.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0013-seed-ymove-link
      author: aligner
      comment: 운동 29 개와 목표 자세 9 개에 YMove slug 와 썸네일 URL 적재
      changes:
        - sqlFile:
            path: seed/003-update-ymove-link.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.exercise SET ymove_slug = NULL, thumbnail_url = NULL WHERE exercise_id BETWEEN 101 AND 129
        - sql:
            sql: UPDATE catalog.target_pose SET ymove_slug = NULL WHERE target_pose_id BETWEEN 1 AND 9

  - changeSet:
      id: catalog-0014-seed-exercise-voice-cue
      author: aligner
      comment: 운동 29 개의 한글 음성 큐 대본 적재
      changes:
        - sqlFile:
            path: seed/004-exercise-voice-cue.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM catalog.exercise_voice_cue WHERE exercise_id BETWEEN 101 AND 129

  # 근육 seed 다. muscle 이 exercise_muscle 의 FK 부모라 순서가 고정이다.
  - changeSet:
      id: catalog-0015-seed-muscle
      author: aligner
      comment: Figma 근육맵 컴포넌트가 관리하는 근육 22 개 적재
      changes:
        - sqlFile:
            path: seed/005-muscle.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM catalog.muscle

  - changeSet:
      id: catalog-0016-seed-exercise-muscle
      author: aligner
      comment: 운동 29 개가 쓰는 근육 매핑 적재
      changes:
        - sqlFile:
            path: seed/006-exercise-muscle.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM catalog.exercise_muscle WHERE exercise_id BETWEEN 101 AND 129

  # 근육별 핵심 동작 문구. DDL 과 seed 를 나눠 쌓는다 — 컬럼은 스키마이고 문구는 감수 대상이라
  # 되돌리는 단위가 다르다.
  - changeSet:
      id: catalog-0017-add-exercise-muscle-description
      author: aligner
      comment: 운동 근육 매핑에 핵심 동작 문구 컬럼 추가
      changes:
        - sqlFile:
            path: ddl/010-add-exercise-muscle-description.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0018-seed-exercise-muscle-description
      author: aligner
      comment: 운동 29 개의 근육별 핵심 동작 문구 적재
      changes:
        - sqlFile:
            path: seed/007-exercise-muscle-description.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.exercise_muscle SET description = NULL WHERE exercise_id BETWEEN 101 AND 129

  # 목표 자세 썸네일. 운동 썸네일(0012~0013)과 같은 자산이라 값을 새로 받지 않고 조인으로 옮긴다.
  - changeSet:
      id: catalog-0019-add-target-pose-thumbnail-url
      author: aligner
      comment: 목표 자세에 영상 썸네일 URL 컬럼 추가
      changes:
        - sqlFile:
            path: ddl/011-add-target-pose-thumbnail-url.sql
            relativeToChangelogFile: true

  - changeSet:
      id: catalog-0020-seed-target-pose-thumbnail-url
      author: aligner
      comment: 목표 자세 9 개의 썸네일 URL 을 같은 slug 의 운동에서 적재
      changes:
        - sqlFile:
            path: seed/008-target-pose-thumbnail-url.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.target_pose SET thumbnail_url = NULL WHERE target_pose_id BETWEEN 1 AND 9

  # 002-exercise.sql 이 감수 대기로 비워둔 exercise 컬럼 3 개를 채운다. 값이 전부 감수 전
  # 임시값이라 컬럼별로 changeset 을 나눈다 — 감수가 하나만 뒤집을 때 그것만 되돌린다.
  - changeSet:
      id: catalog-0021-seed-exercise-category
      author: aligner
      comment: 분류가 비어 있던 운동 18 개에 유연성·근력 강화 부여
      changes:
        - sqlFile:
            path: seed/009-exercise-category.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            # 이 changeset 이 채운 18 개만 지운다. NOT IN 으로 "원래 값이 있던 11 개를 제외한
            # 전부" 를 쓰면 훗날 추가된 운동의 분류까지 함께 날아간다.
            sql: UPDATE catalog.exercise SET category = NULL WHERE exercise_id IN (102, 103, 104, 105, 107, 108, 111, 114, 115, 118, 119, 121, 122, 123, 124, 125, 126, 127)

  - changeSet:
      id: catalog-0022-seed-exercise-met-value
      author: aligner
      comment: 운동 29 개에 MET 적재 — 이 값이 없으면 칼로리가 전부 null 이다
      changes:
        - sqlFile:
            path: seed/010-exercise-met-value.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.exercise SET met_value = NULL WHERE exercise_id BETWEEN 101 AND 129

  - changeSet:
      id: catalog-0023-seed-exercise-default-set-count
      author: aligner
      comment: 운동 29 개의 기본 세트 수를 1 로 적재
      changes:
        - sqlFile:
            path: seed/011-exercise-default-set-count.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.exercise SET default_set_count = NULL WHERE exercise_id BETWEEN 101 AND 129

  - changeSet:
      id: catalog-0024-seed-exercise-video-duration
      author: aligner
      comment: 기본 수행 시간을 YMove 영상 길이인 30 초로 적재
      changes:
        - sqlFile:
            path: seed/012-exercise-video-duration.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.exercise SET default_duration_seconds = NULL WHERE exercise_id BETWEEN 101 AND 129

  - changeSet:
      id: catalog-0025-seed-exercise-difficulty
      author: aligner
      comment: 운동 29 개에 난이도 EASY·MEDIUM·HARD 적재 — 감수 전 임시값이다
      changes:
        - sqlFile:
            path: seed/013-exercise-difficulty.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: UPDATE catalog.exercise SET difficulty = NULL WHERE exercise_id BETWEEN 101 AND 129
