services:
  api:
    image: ${ALIGNER_IMAGE:?ALIGNER_IMAGE가 필요합니다}
    container_name: aligner-api
    env_file:
      - .env
    ports:
      - "${HOST_PORT:-8080}:${SERVER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    restart: unless-stopped
    stop_grace_period: 30s

  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: aligner
      POSTGRES_USER: aligner
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aligner -d aligner"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
