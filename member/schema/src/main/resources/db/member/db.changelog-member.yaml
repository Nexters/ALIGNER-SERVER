# member 도메인 changelog.
#
# changeset id 에 도메인 접두사를 붙인다. 도메인 5 개가 public.DATABASECHANGELOG 하나를
# 공유하므로 접두사가 없으면 번호가 겹친다 (docs/architecture.md §6).
#
# 이미 적용된 changeset 은 수정하지 않고 새로 쌓는다.
databaseChangeLog:
  - changeSet:
      id: member-0001-create-schema
      author: aligner
      comment: member 스키마 생성
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS member

  - changeSet:
      id: member-0002-create-member
      author: aligner
      comment: 회원 테이블 생성
      changes:
        - sqlFile:
            path: ddl/001-create-member.sql
            relativeToChangelogFile: true

  - changeSet:
      id: member-0003-add-onboarding-and-withdrawal
      author: aligner
      comment: 온보딩 입력값(신체·경력·강화 설정)과 탈퇴 표시 추가
      changes:
        - sqlFile:
            path: ddl/002-add-onboarding-and-withdrawal.sql
            relativeToChangelogFile: true

  # 프론트 연동 테스트용 임시 회원. **context: dev 라 운영에는 들어가지 않는다.**
  #
  # Liquibase 는 런타임에 컨텍스트를 주지 않으면 컨텍스트가 붙은 changeset 도 전부 실행한다.
  # 그래서 컨텍스트만으로는 안전하지 않고, application.yml 이 spring.liquibase.contexts 의
  # 기본값을 prod 로 두어 **잊어버리면 안 들어가는 쪽**으로 잠갔다. dev 환경이 명시적으로
  # LIQUIBASE_CONTEXTS=dev 를 줘야 적재된다.
  - changeSet:
      id: member-0004-seed-dev-member
      author: aligner
      context: dev
      comment: 프론트 연동 테스트용 임시 회원 (dev 전용)
      changes:
        - sqlFile:
            path: seed/001-dev-member.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM member.member WHERE member_id = 900001
