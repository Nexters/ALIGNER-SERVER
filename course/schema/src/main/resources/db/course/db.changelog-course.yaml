# course 도메인 changelog.
#
# changeset id 에 도메인 접두사를 붙인다. 도메인 5 개가 public.DATABASECHANGELOG 하나를
# 공유하므로 접두사가 없으면 번호가 겹친다 (docs/architecture.md §6).
#
# 이미 적용된 changeset 은 수정하지 않고 새로 쌓는다.
#
# 순서가 FK 를 따른다. template_step 은 course_template 뒤, course 는 course_template 뒤,
# course_step 은 course 뒤, stamp 는 course 뒤여야 한다.
databaseChangeLog:
  - changeSet:
      id: course-0001-create-schema
      author: aligner
      comment: course 스키마 생성
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS course

  - changeSet:
      id: course-0002-create-course-template
      author: aligner
      comment: 코스 템플릿 테이블 생성
      changes:
        - sqlFile:
            path: ddl/001-create-course-template.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0003-create-template-step
      author: aligner
      comment: 템플릿 스텝 테이블 생성
      changes:
        - sqlFile:
            path: ddl/002-create-template-step.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0004-create-template-step-exercise
      author: aligner
      comment: 템플릿 스텝 운동 테이블 생성
      changes:
        - sqlFile:
            path: ddl/003-create-template-step-exercise.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0005-create-course
      author: aligner
      comment: 회원 처방 코스 테이블 생성
      changes:
        - sqlFile:
            path: ddl/004-create-course.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0006-create-course-step
      author: aligner
      comment: 회원 코스 스텝 테이블 생성
      changes:
        - sqlFile:
            path: ddl/005-create-course-step.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0007-create-course-step-exercise
      author: aligner
      comment: 회원 코스 스텝 운동 테이블 생성
      changes:
        - sqlFile:
            path: ddl/006-create-course-step-exercise.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0008-create-stamp
      author: aligner
      comment: 도장 테이블 생성
      changes:
        - sqlFile:
            path: ddl/007-create-stamp.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0009-add-course-version
      author: aligner
      comment: 동시 세션 완료가 서로를 덮지 않도록 낙관적 락 추가
      changes:
        - sqlFile:
            path: ddl/008-add-course-version.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0010-add-course-attempt-no
      author: aligner
      comment: 완주한 코스를 다시 돌 수 있도록 재도전 회차 추가
      changes:
        - sqlFile:
            path: ddl/009-add-course-attempt-no.sql
            relativeToChangelogFile: true

  - changeSet:
      id: course-0011-add-stamp-attempt-no
      author: aligner
      comment: 도장을 자세당 하나에서 회차당 하나로 넓힘
      changes:
        - sqlFile:
            path: ddl/010-add-stamp-attempt-no.sql
            relativeToChangelogFile: true

  # 여기부터 seed 다. 코스 템플릿은 감수 콘텐츠라 rollback 을 붙인다
  # (catalog changelog 와 같은 판단). 자식부터 지워야 FK 에 걸리지 않는다.
  - changeSet:
      id: course-0012-seed-course-template
      author: aligner
      comment: 9 개 루틴의 코스 템플릿·스텝·스텝 운동 적재
      changes:
        - sqlFile:
            path: seed/001-course-template.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM course.template_step_exercise WHERE template_step_id BETWEEN 1 AND 63
        - sql:
            sql: DELETE FROM course.template_step WHERE template_step_id BETWEEN 1 AND 63
        - sql:
            sql: DELETE FROM course.course_template WHERE template_id BETWEEN 1 AND 9

  # 모든 스텝을 30 초 × N 세트로 맞춘다. 30 초는 YMove 영상 길이(2026-08-19 실측)이고
  # 총 시간을 보존하므로 루틴 길이는 15/17.5/20 분 그대로다.
  - changeSet:
      id: course-0013-align-to-video-length
      author: aligner
      comment: 스텝 단위를 YMove 영상 길이인 30 초로 맞추고 세트로 반복
      changes:
        - sqlFile:
            path: seed/002-align-to-video-length.sql
            relativeToChangelogFile: true
      rollback:
        # 정본 값으로 복원한다. 30 초로 쪼갠 뒤에는 원래 표기를 역산할 수 없다 —
        # 보트자세는 105 초를 120 초로 반올림해 총 시간까지 달라졌다.
        #
        # 템플릿을 먼저 되돌리고, 마지막 문이 그 값을 회원 코스로 다시 복사한다. 템플릿만
        # 되돌리면 회원 코스가 30 초 단위로 남아 절반만 마이그레이션된 상태가 된다.
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 90, set_count = NULL WHERE template_step_id IN (7, 14, 20, 28, 35, 49, 56)
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 150, set_count = NULL WHERE template_step_id IN (5, 8, 9, 15, 16, 24, 30, 32, 38, 39, 46, 51, 52, 59, 60)
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 120, set_count = NULL WHERE template_step_id IN (1, 2, 3, 4, 10, 11, 12, 17, 18, 19, 22, 23, 25, 26, 29, 31, 33, 36, 37, 40, 41, 43, 44, 45, 47, 50, 53, 54, 57, 58, 61, 62)
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 30, set_count = 3 WHERE template_step_id IN (6, 27)
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 40, set_count = 3 WHERE template_step_id IN (13, 48, 55)
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 35, set_count = 3 WHERE template_step_id = 34
        - sql:
            sql: UPDATE course.template_step_exercise SET duration_seconds = 30, set_count = 4 WHERE template_step_id IN (21, 42, 63)
        # 회원 코스는 생성 시점에 템플릿을 그대로 복사한 것이고 이후 편성을 바꾸는 기능이
        # 없다 (ddl/005-create-course-step.sql). course_step 에 template_step_id 는 없지만
        # course.template_id 와 step_order 로 되짚을 수 있어 원래 값이 복원된다.
        - sql:
            sql: |
              UPDATE course.course_step_exercise cse
                 SET duration_seconds = tse.duration_seconds,
                     set_count = tse.set_count
                FROM course.course_step cs
                     JOIN course.course c ON c.course_id = cs.course_id
                     JOIN course.template_step ts ON ts.template_id = c.template_id
                      AND ts.step_order = cs.step_order
                     JOIN course.template_step_exercise tse ON tse.template_step_id = ts.template_step_id
               WHERE cs.course_step_id = cse.course_step_id
                 AND tse.display_order = cse.display_order
