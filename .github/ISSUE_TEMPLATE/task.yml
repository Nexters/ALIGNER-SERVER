name: 작업
description: 설정, 문서, 리팩터링 등 기능 개발이 아닌 작업입니다.
title: "[CHORE] "
labels: ["chore"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: 작업 종류
      options:
        - 설정 · 인프라 (chore / ci)
        - 문서 (docs)
        - 리팩터링 (refactor)
        - 테스트 (test)
        - 기타
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 작업 내용
      description: 무엇을 왜 하는지 적어주세요.
      value: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 무엇이 되면 이 이슈를 닫을 수 있나요?
    validations:
      required: false
