name: Gradle 검증

on:
  pull_request:
  push:
    branches:
      - main
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: 빌드·린트·통합 테스트
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4

      - name: JDK 25 설정
        uses: actions/setup-java@v5
        with:
          distribution: corretto
          java-version: '25'

      - name: Gradle 설정 및 빌드 캐시 활성화
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/develop' && github.ref != 'refs/heads/main' }}

      - name: Gradle wrapper 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 빌드·린트·통합 테스트 실행
        run: ./gradlew ktlintCheck build integrationTest --build-cache --parallel
