name: Gradle 검증

# Gradle 프로젝트가 도입되면 모든 PR과 통합 브랜치에서 빌드·린트·통합 테스트를 강제한다.
# 아직 wrapper와 Kotlin/Gradle 소스가 없는 저장소 초기 단계에서는 명시적으로 건너뛴다.

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Gradle wrapper 존재 확인
        id: gradle
        shell: bash
        run: |
          if [[ -f gradlew ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if find . -type f \( -name '*.gradle.kts' -o -name '*.gradle' -o -name '*.kt' \) \
            -not -path './.gradle/*' -print -quit | grep -q .; then
            echo "::error::Gradle 또는 Kotlin 소스가 있는데 gradlew가 없습니다. Wrapper를 함께 추가하세요."
            exit 1
          fi

          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "Gradle 프로젝트가 아직 없어 검증을 건너뜁니다."

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        if: steps.gradle.outputs.enabled == 'true'
        with:
          distribution: corretto
          java-version: '25'
          cache: gradle

      - name: Gradle wrapper 실행 권한 부여
        if: steps.gradle.outputs.enabled == 'true'
        run: chmod +x ./gradlew

      - name: 빌드·린트·통합 테스트
        if: steps.gradle.outputs.enabled == 'true'
        run: ./gradlew --no-daemon ktlintCheck build integrationTest
