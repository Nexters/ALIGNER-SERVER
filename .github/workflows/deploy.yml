name: Deploy

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build application-api bootJar
        run: |
          ./gradlew :application-api:bootJar --build-cache --parallel
          mapfile -t jars < <(find application-api/build/libs -type f -name '*.jar' -print)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one bootJar in application-api/build/libs"
            exit 1
          fi
          cp "${jars[0]}" application-api.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aligner-server
          flavor: |
            latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref_name == 'develop' }}
            type=raw,value=latest,enable=${{ github.ref_name == 'main' }}
            type=raw,value=main,enable=${{ github.ref_name == 'main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Log image details
        run: |
          echo "Image digest: ${{ steps.build-push.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

  deploy-dev:
    name: Deploy to Dev (Sandbox)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_name == 'develop'
    environment: dev
    steps:
      - name: Validate Deployment Prerequisites
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          set -euo pipefail
          missing_secrets=()
          if [[ -z "$TS_CLIENT_ID" ]]; then missing_secrets+=("TAILSCALE_OAUTH_CLIENT_ID"); fi
          if [[ -z "$TS_SECRET" ]]; then missing_secrets+=("TAILSCALE_OAUTH_SECRET"); fi
          if [[ -z "$KUBECONFIG_DATA" ]]; then missing_secrets+=("KUBECONFIG"); fi
          if [[ -z "$DEV_ENV_FILE" ]]; then missing_secrets+=("DEV_ENV_FILE"); fi

          if [[ ${#missing_secrets[@]} -gt 0 ]]; then
            echo "::error title=Missing Required Secrets::The following required secrets are missing in 'dev' environment: ${missing_secrets[*]}"
            exit 1
          fi
          echo "All required deployment secrets are verified."

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Inject Secret and Rollout Restart
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          set -euo pipefail
          TMP_ENV_FILE=$(mktemp)
          trap 'rm -f "$TMP_ENV_FILE"' EXIT
          printf '%s\n' "$DEV_ENV_FILE" > "$TMP_ENV_FILE"
          chmod 600 "$TMP_ENV_FILE"

          echo "Injecting secret aligner-api-secrets into namespace aligner-sandbox..."
          kubectl create secret generic aligner-api-secrets \
            --from-env-file="$TMP_ENV_FILE" \
            --namespace="aligner-sandbox" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Triggering rollout restart for deployment/aligner-sandbox-api in namespace aligner-sandbox..."
          kubectl rollout restart deployment/aligner-sandbox-api -n aligner-sandbox

      - name: Verify Kubernetes Workload Rollout
        run: |
          echo "Waiting for deployment/aligner-sandbox-api rollout to complete (timeout: 180s)..."
          kubectl rollout status deployment/aligner-sandbox-api -n aligner-sandbox --timeout=180s

      - name: Verify Active HTTP Health Probe
        run: |
          set -euo pipefail
          HEALTH_URL="https://dev-api.aligneryoga.com/actuator/health"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5

          echo "Probing application health at $HEALTH_URL..."
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Health check passed! HTTP status $STATUS received (attempt $i/$MAX_ATTEMPTS)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: Received HTTP status '$STATUS'. Retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "::error title=Health Check Failed::Active health probe to $HEALTH_URL failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Collect Kubernetes Diagnostics on Failure
        if: failure()
        run: |
          echo "::warning title=Deployment Failed::Deployment failed or timed out. Fetching non-sensitive diagnostics..."
          
          echo "--- Deployment ---"
          kubectl get deployment/aligner-sandbox-api -n aligner-sandbox -o wide || true

          echo "--- Pods ---"
          kubectl get pods -n aligner-sandbox -l app=aligner-sandbox-api -o wide || true

          echo "--- Recent Events ---"
          kubectl get events -n aligner-sandbox --sort-by='.metadata.creationTimestamp' | tail -n 30 || true


      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "### 🚀 Dev (Sandbox) 배포 완료!"
            echo "- **환경**: \`dev\` (namespace: aligner-sandbox)"
            echo "- **접속 도메인**: [https://dev-api.aligneryoga.com](https://dev-api.aligneryoga.com)"
            echo "- **Swagger UI**: [https://dev-api.aligneryoga.com/swagger-ui/index.html](https://dev-api.aligneryoga.com/swagger-ui/index.html)"
            echo "- **이미지**: \`ghcr.io/${{ github.repository_owner }}/aligner-server:develop\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-prod:
    name: Deploy to Prod (Production)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref_name == 'main' || startsWith(github.ref_name, 'v')
    environment: prod
    steps:
      - name: Validate Deployment Prerequisites
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          missing_secrets=()
          if [[ -z "$TS_CLIENT_ID" ]]; then missing_secrets+=("TAILSCALE_OAUTH_CLIENT_ID"); fi
          if [[ -z "$TS_SECRET" ]]; then missing_secrets+=("TAILSCALE_OAUTH_SECRET"); fi
          if [[ -z "$KUBECONFIG_DATA" ]]; then missing_secrets+=("KUBECONFIG"); fi
          if [[ -z "$PROD_ENV_FILE" ]]; then missing_secrets+=("PROD_ENV_FILE"); fi

          if [[ ${#missing_secrets[@]} -gt 0 ]]; then
            echo "::error title=Missing Required Secrets::The following required secrets are missing in 'prod' environment: ${missing_secrets[*]}"
            exit 1
          fi
          echo "All required deployment secrets are verified."

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.36.1'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Inject Secret and Rollout Restart
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          set -euo pipefail
          TMP_ENV_FILE=$(mktemp)
          trap 'rm -f "$TMP_ENV_FILE"' EXIT
          printf '%s\n' "$PROD_ENV_FILE" > "$TMP_ENV_FILE"
          chmod 600 "$TMP_ENV_FILE"

          echo "Injecting secret aligner-api-secrets into namespace aligner..."
          kubectl create secret generic aligner-api-secrets \
            --from-env-file="$TMP_ENV_FILE" \
            --namespace="aligner" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Triggering rollout restart for deployment/aligner-api in namespace aligner..."
          kubectl rollout restart deployment/aligner-api -n aligner

      - name: Verify Kubernetes Workload Rollout
        run: |
          echo "Waiting for deployment/aligner-api rollout to complete (timeout: 180s)..."
          kubectl rollout status deployment/aligner-api -n aligner --timeout=180s

      - name: Verify Active HTTP Health Probe
        run: |
          set -euo pipefail
          HEALTH_URL="https://api.aligneryoga.com/actuator/health"
          MAX_ATTEMPTS=12
          SLEEP_SECONDS=5

          echo "Probing application health at $HEALTH_URL..."
          for ((i=1; i<=MAX_ATTEMPTS; i++)); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "$HEALTH_URL" || true)
            if [[ "$STATUS" == "200" ]]; then
              echo "✅ Health check passed! HTTP status $STATUS received (attempt $i/$MAX_ATTEMPTS)"
              exit 0
            fi
            echo "Attempt $i/$MAX_ATTEMPTS: Received HTTP status '$STATUS'. Retrying in ${SLEEP_SECONDS}s..."
            sleep "$SLEEP_SECONDS"
          done

          echo "::error title=Health Check Failed::Active health probe to $HEALTH_URL failed after $MAX_ATTEMPTS attempts."
          exit 1

      - name: Collect Kubernetes Diagnostics on Failure
        if: failure()
        run: |
          echo "::warning title=Deployment Failed::Deployment failed or timed out. Fetching non-sensitive diagnostics..."
          
          echo "--- Deployment ---"
          kubectl get deployment/aligner-api -n aligner -o wide || true

          echo "--- Pods ---"
          kubectl get pods -n aligner -l app=aligner-api -o wide || true

          echo "--- Recent Events ---"
          kubectl get events -n aligner --sort-by='.metadata.creationTimestamp' | tail -n 30 || true

      - name: Deployment Summary
        if: success()
        run: |
          {
            echo "### 🏢 Prod (Production) 배포 완료!"
            echo "- **환경**: \`prod\` (namespace: aligner)"
            echo "- **접속 도메인**: [https://api.aligneryoga.com](https://api.aligneryoga.com)"
            echo "- **이미지**: \`ghcr.io/${{ github.repository_owner }}/aligner-server:latest\`"
          } >> "$GITHUB_STEP_SUMMARY"
