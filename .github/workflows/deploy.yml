name: Deploy

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build application-api bootJar
        run: |
          ./gradlew :application-api:bootJar --no-daemon
          mapfile -t jars < <(find application-api/build/libs -type f -name '*.jar' -print)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one bootJar in application-api/build/libs"
            exit 1
          fi
          cp "${jars[0]}" application-api.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aligner-server
          flavor: |
            latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Output image digest and tag
        run: |
          echo "Image digest: ${{ steps.build-push.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

  deploy-sandbox:
    name: Deploy to Sandbox (Dev)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: sandbox
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Check Tailscale credentials
        id: tailscale-check
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          if [[ -n "$TS_CLIENT_ID" && -n "$TS_SECRET" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tailscale credentials (TAILSCALE_OAUTH_CLIENT_ID / TAILSCALE_OAUTH_SECRET) are not configured. Skipping Kubernetes deployment."
          fi

      - name: Connect to Tailscale
        if: steps.tailscale-check.outputs.available == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Kubeconfig
        if: steps.tailscale-check.outputs.available == 'true' && secrets.KUBECONFIG != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Inject Kubernetes Secret and Trigger Rollout
        if: steps.tailscale-check.outputs.available == 'true'
        env:
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
        run: |
          if [[ -n "$DEV_ENV_FILE" ]]; then
            TMP_ENV_FILE=$(mktemp)
            printf '%s\n' "$DEV_ENV_FILE" > "$TMP_ENV_FILE"
            chmod 600 "$TMP_ENV_FILE"

            echo "Injecting secret aligner-api-secrets into namespace aligner-sandbox..."
            kubectl create secret generic aligner-api-secrets \
              --from-env-file="$TMP_ENV_FILE" \
              --namespace=aligner-sandbox \
              --dry-run=client -o yaml | kubectl apply -f -

            rm -f "$TMP_ENV_FILE"
          else
            echo "::warning::DEV_ENV_FILE secret payload is empty for sandbox."
          fi

          echo "Triggering rollout restart for deployment/aligner-sandbox-api in namespace aligner-sandbox..."
          kubectl rollout restart deployment/aligner-sandbox-api -n aligner-sandbox

  deploy-production:
    name: Deploy to Production (Prod)
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    environment: production
    steps:
      - name: Setup kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Check Tailscale credentials
        id: tailscale-check
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          if [[ -n "$TS_CLIENT_ID" && -n "$TS_SECRET" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tailscale credentials (TAILSCALE_OAUTH_CLIENT_ID / TAILSCALE_OAUTH_SECRET) are not configured. Skipping Kubernetes deployment."
          fi

      - name: Connect to Tailscale
        if: steps.tailscale-check.outputs.available == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Kubeconfig
        if: steps.tailscale-check.outputs.available == 'true' && secrets.KUBECONFIG != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Inject Kubernetes Secret and Trigger Rollout
        if: steps.tailscale-check.outputs.available == 'true'
        env:
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [[ -n "$PROD_ENV_FILE" ]]; then
            TMP_ENV_FILE=$(mktemp)
            printf '%s\n' "$PROD_ENV_FILE" > "$TMP_ENV_FILE"
            chmod 600 "$TMP_ENV_FILE"

            echo "Injecting secret aligner-api-secrets into namespace aligner..."
            kubectl create secret generic aligner-api-secrets \
              --from-env-file="$TMP_ENV_FILE" \
              --namespace=aligner \
              --dry-run=client -o yaml | kubectl apply -f -

            rm -f "$TMP_ENV_FILE"
          else
            echo "::warning::PROD_ENV_FILE secret payload is empty for production."
          fi

          echo "Triggering rollout restart for deployment/aligner-api in namespace aligner..."
          kubectl rollout restart deployment/aligner-api -n aligner
