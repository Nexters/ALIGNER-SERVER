name: Deploy

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build application-api bootJar
        run: |
          ./gradlew :application-api:bootJar --no-daemon
          mapfile -t jars < <(find application-api/build/libs -type f -name '*.jar' -print)
          if [[ "${#jars[@]}" -ne 1 ]]; then
            echo "::error::Expected exactly one bootJar in application-api/build/libs"
            exit 1
          fi
          cp "${jars[0]}" application-api.jar

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/aligner-server
          flavor: |
            latest=false
          tags: |
            type=raw,value=develop,enable=${{ github.ref == 'refs/heads/develop' }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build-push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Output image digest and tag
        run: |
          echo "Image digest: ${{ steps.build-push.outputs.digest }}"
          echo "Image tags: ${{ steps.meta.outputs.tags }}"

  deploy-to-cluster:
    name: Deploy to Cluster
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'
    steps:
      - name: Determine target environment
        id: target
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "namespace=aligner-sandbox" >> "$GITHUB_OUTPUT"
            echo "deployment=aligner-sandbox-api" >> "$GITHUB_OUTPUT"
            echo "environment=sandbox" >> "$GITHUB_OUTPUT"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "namespace=aligner" >> "$GITHUB_OUTPUT"
            echo "deployment=aligner-api" >> "$GITHUB_OUTPUT"
            echo "environment=production" >> "$GITHUB_OUTPUT"
          fi

      - name: Check Tailscale credentials
        id: tailscale-check
        env:
          TS_CLIENT_ID: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          TS_SECRET: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
        run: |
          if [[ -n "$TS_CLIENT_ID" && -n "$TS_SECRET" ]]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Tailscale credentials (TAILSCALE_OAUTH_CLIENT_ID / TAILSCALE_OAUTH_SECRET) are not configured. Skipping Kubernetes deployment."
          fi

      - name: Connect to Tailscale
        if: steps.tailscale-check.outputs.available == 'true'
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:ci

      - name: Configure Kubeconfig
        if: steps.tailscale-check.outputs.available == 'true' && secrets.KUBECONFIG != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          mkdir -p "$HOME/.kube"
          printf '%s\n' "$KUBECONFIG_DATA" > "$HOME/.kube/config"
          chmod 600 "$HOME/.kube/config"

      - name: Inject Kubernetes Secret and Trigger Rollout
        if: steps.tailscale-check.outputs.available == 'true'
        env:
          TARGET_NAMESPACE: ${{ steps.target.outputs.namespace }}
          TARGET_DEPLOYMENT: ${{ steps.target.outputs.deployment }}
          DEV_ENV_FILE: ${{ secrets.DEV_ENV_FILE }}
          PROD_ENV_FILE: ${{ secrets.PROD_ENV_FILE }}
        run: |
          if [[ "${{ steps.target.outputs.environment }}" == "sandbox" ]]; then
            ENV_PAYLOAD="$DEV_ENV_FILE"
          else
            ENV_PAYLOAD="$PROD_ENV_FILE"
          fi

          if [[ -n "$ENV_PAYLOAD" ]]; then
            TMP_ENV_FILE=$(mktemp)
            printf '%s\n' "$ENV_PAYLOAD" > "$TMP_ENV_FILE"
            chmod 600 "$TMP_ENV_FILE"

            echo "Injecting secret aligner-api-secrets into namespace ${TARGET_NAMESPACE}..."
            kubectl create secret generic aligner-api-secrets \
              --from-env-file="$TMP_ENV_FILE" \
              --namespace="$TARGET_NAMESPACE" \
              --dry-run=client -o yaml | kubectl apply -f -

            rm -f "$TMP_ENV_FILE"
          else
            echo "::warning::Environment secret payload is empty for ${{ steps.target.outputs.environment }}."
          fi

          echo "Triggering rollout restart for deployment/${TARGET_DEPLOYMENT} in namespace ${TARGET_NAMESPACE}..."
          kubectl rollout restart "deployment/${TARGET_DEPLOYMENT}" -n "$TARGET_NAMESPACE"
