name: 하네스 검증

# CI가 harness/ 원본에서 생성물을 새로 만들고 검증한다.
# 생성물(.claude/·.codex/·.agents/)은 Git에 올리지 않는다.

on:
  pull_request:
    paths:
      - 'harness/**'
      - 'scripts/harness/**'
      - 'tests/harness/**'
      - '.github/workflows/harness.yml'
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Python 생성물 추적 금지
        run: |
          if git ls-files -z | python3 -c 'import sys; files = sys.stdin.buffer.read().split(b"\0"); raise SystemExit(any(b"__pycache__" in f.split(b"/") or f.endswith((b".pyc", b".pyo", b".pyd")) for f in files))'; then
            :
          else
            echo "::error::추적 중인 Python bytecode 또는 __pycache__가 있습니다."
            exit 1
          fi

      - name: 하네스 생성물 추적 금지
        run: |
          if git ls-files -- .claude .codex .agents | grep -q .; then
            echo "::error::생성물(.claude/·.codex/·.agents/)은 Git에 올리지 않습니다."
            exit 1
          fi

      # 의존성 설치 단계가 없는 것은 의도적이다. 생성기는 표준 라이브러리만 쓴다.
      - name: 생성기 단위·왕복 테스트
        run: python3 -m unittest discover -s tests/harness -v

      - name: 실제 사용 경로 생성·검증
        run: |
          python3 scripts/harness/generate.py
          python3 scripts/harness/validate.py
