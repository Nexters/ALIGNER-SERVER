name: 하네스 검증

# harness/ 원본과 생성물(.claude/·.codex/·.agents/)이 어긋나면 막는다.
# 생성물을 커밋에 포함하는 구조라, 원본만 고치고 generate.py 를 안 돌린 PR 이
# 병합되면 하네스마다 다른 규칙을 보게 된다. 그 상태는 눈으로 안 보인다.

on:
  pull_request:
    paths:
      - 'harness/**'
      - 'scripts/harness/**'
      - 'tests/harness/**'
      - '.claude/**'
      - '.codex/**'
      - '.agents/**'
      - '.github/workflows/harness.yml'
  push:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 의존성 설치 단계가 없는 것은 의도적이다. 생성기는 표준 라이브러리만 쓴다.
      - name: 테스트
        run: python3 -m unittest discover -s tests/harness -v

      - name: 생성물 drift 검사
        run: python3 scripts/harness/validate.py

      - name: 다시 생성해도 변화가 없는지 확인
        run: |
          python3 scripts/harness/generate.py
          if ! git diff --exit-code; then
            echo "::error::생성물이 원본과 다릅니다. python3 scripts/harness/generate.py 를 돌리고 결과를 커밋하세요."
            exit 1
          fi
