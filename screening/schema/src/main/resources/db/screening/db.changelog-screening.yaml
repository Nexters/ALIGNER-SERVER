# screening 도메인 changelog.
#
# changeset id 에 도메인 접두사를 붙인다. 도메인 5 개가 public.DATABASECHANGELOG 하나를
# 공유하므로 접두사가 없으면 번호가 겹친다 (docs/architecture.md §6).
#
# 이미 적용된 changeset 은 수정하지 않고 새로 쌓는다.
#
# 순서가 FK 를 따른다. cause 는 body_part 뒤, cause_rule 은 cause 뒤,
# screening_answer 와 screening_cause 는 screening_result 뒤여야 한다.
databaseChangeLog:
  - changeSet:
      id: screening-0001-create-schema
      author: aligner
      comment: screening 스키마 생성
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS screening

  - changeSet:
      id: screening-0002-create-body-part
      author: aligner
      comment: 부위 테이블 생성
      changes:
        - sqlFile:
            path: ddl/001-create-body-part.sql
            relativeToChangelogFile: true

  - changeSet:
      id: screening-0003-create-cause
      author: aligner
      comment: 원인 테이블 생성
      changes:
        - sqlFile:
            path: ddl/002-create-cause.sql
            relativeToChangelogFile: true

  - changeSet:
      id: screening-0004-create-cause-rule
      author: aligner
      comment: 자세 체감 분기 규칙 테이블 생성
      changes:
        - sqlFile:
            path: ddl/003-create-cause-rule.sql
            relativeToChangelogFile: true

  - changeSet:
      id: screening-0005-create-screening-result
      author: aligner
      comment: 진단 결과 테이블 생성
      changes:
        - sqlFile:
            path: ddl/004-create-screening-result.sql
            relativeToChangelogFile: true

  - changeSet:
      id: screening-0006-create-screening-answer
      author: aligner
      comment: 자세 체감 응답 테이블 생성
      changes:
        - sqlFile:
            path: ddl/005-create-screening-answer.sql
            relativeToChangelogFile: true

  - changeSet:
      id: screening-0007-create-screening-cause
      author: aligner
      comment: 판별된 원인 테이블 생성
      changes:
        - sqlFile:
            path: ddl/006-create-screening-cause.sql
            relativeToChangelogFile: true

  - changeSet:
      id: screening-0008-relax-screening-result-body-part
      author: aligner
      comment: 느끼는 부위 선입력 제거 — perceived_body_part_code NULL 허용
      changes:
        - sqlFile:
            path: ddl/007-relax-screening-result-body-part.sql
            relativeToChangelogFile: true

  # 여기부터 seed 다. DDL 과 달리 감수로 값이 바뀌므로 rollback 을 붙인다
  # (catalog changelog 와 같은 판단).
  - changeSet:
      id: screening-0009-seed-body-part
      author: aligner
      comment: 부위 3 개 적재
      changes:
        - sqlFile:
            path: seed/001-body-part.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM screening.body_part WHERE body_part_code IN ('BACK', 'ABDOMEN', 'PELVIS')

  # 프론트 연동 테스트용 진단 결과. **context: dev 라 운영에는 들어가지 않는다.**
  # 잠금 방식은 member-0004-seed-dev-member 와 같다 (application.yml 의 contexts 기본값 prod).
  - changeSet:
      id: screening-0010-seed-dev-screening-result
      author: aligner
      context: dev
      comment: 임시 회원의 진단 결과 (dev 전용). POST /courses 가 SCREENING_REQUIRED 로 막히지 않게 한다
      changes:
        - sqlFile:
            path: seed/002-dev-screening-result.sql
            relativeToChangelogFile: true
      rollback:
        - sql:
            sql: DELETE FROM screening.screening_result WHERE result_id = 900001
        - sql:
            sql: DELETE FROM screening.cause WHERE cause_code = 'DEV_PLACEHOLDER_CAUSE'
