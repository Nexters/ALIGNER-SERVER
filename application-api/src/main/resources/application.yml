# ==============================================================================
# 1. 공통 기본 설정 (Common Base & Fallback)
# ==============================================================================
spring:
  config:
    import: "optional:file:./application-secret.properties"
  application:
    name: aligner-server
  datasource:
    username: ${DB_USERNAME:aligner}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog-master.yaml
    liquibase-schema: public
    contexts: ${LIQUIBASE_CONTEXTS:prod}

server:
  port: ${SERVER_PORT:8080}

aligner:
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
      max-age-seconds: ${CORS_MAX_AGE_SECONDS:3600}
  auth:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:1209600}
      issuer: aligner
    kakao:
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      # 프론트의 인가 코드 착지 라우트다. 환경마다 다르고, 카카오 콘솔에 등록된 값과
      # 한 글자라도 다르면 토큰 교환이 거부된다. 프로필별 기본값은 아래 각 프로필 문서에 있고,
      # KAKAO_REDIRECT_URI 를 주면 언제나 그 값이 이긴다.
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}
      connect-timeout-millis: ${KAKAO_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${KAKAO_READ_TIMEOUT_MILLIS:3000}
  ymove:
    base-url: ${YMOVE_BASE_URL:https://exercise-api.ymove.app/api/v2}
    api-key: ${YMOVE_API_KEY}
    connect-timeout-millis: ${YMOVE_CONNECT_TIMEOUT_MILLIS:2000}
    read-timeout-millis: ${YMOVE_READ_TIMEOUT_MILLIS:3000}
    cache-ttl-seconds: ${YMOVE_CACHE_TTL_SECONDS:1800}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method

logging:
  pattern:
    correlation: "[traceId=%X{traceId:-} spanId=%X{spanId:-} memberId=%X{memberId:-}] "

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  tracing:
    sampling:
      # 헤드 샘플링은 항상 1.0 이다. 실제 볼륨 결정은 클러스터의 OTel Collector
      # tail_sampling 이 한다(에러/5xx/1초초과/핵심 라우트 100%, 나머지 10%).
      # 앱 단에서 줄이면 Collector 가 에러 트레이스를 놓친다.
      probability: 1.0
    export:
      otlp:
        enabled: false
  otlp:
    metrics:
      export:
        enabled: false

---
# ==============================================================================
# 2. 로컬 테스트 환경 프로필 (test Profile)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: test
  liquibase:
    contexts: prod

logging:
  level:
    team.aligner: DEBUG

aligner:
  web:
    cors:
      allowed-origins: http://localhost:5173,http://localhost:3000
  auth:
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:5173/oauth/kakao}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

---
# ==============================================================================
# 3. 개발 / 테스트 서버 프로필 (dev Profile - dev-api.aligneryoga.com)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    primary:
      url: ${DB_PRIMARY_URL}
      maximum-pool-size: ${DB_PRIMARY_MAX_POOL_SIZE:10}
      pool-name: HikariPool-Primary
    readonly:
      url: ${DB_READONLY_URL}
      maximum-pool-size: ${DB_READONLY_MAX_POOL_SIZE:20}
      pool-name: HikariPool-Replica
  liquibase:
    contexts: ${LIQUIBASE_CONTEXTS:dev,prod}

logging:
  level:
    team.aligner: DEBUG

aligner:
  web:
    cors:
      allowed-origins: http://localhost:5173,https://dev.aligneryoga.com
  auth:
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:https://dev.aligneryoga.com/oauth/kakao}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

---
# ==============================================================================
# 4. 운영 환경 프로필 (prod Profile - api.aligneryoga.com)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    primary:
      url: ${DB_PRIMARY_URL}
      maximum-pool-size: ${DB_PRIMARY_MAX_POOL_SIZE:10}
      pool-name: HikariPool-Primary
    readonly:
      url: ${DB_READONLY_URL}
      maximum-pool-size: ${DB_READONLY_MAX_POOL_SIZE:20}
      pool-name: HikariPool-Replica
  liquibase:
    contexts: ${LIQUIBASE_CONTEXTS:prod}

logging:
  level:
    team.aligner: INFO
  structured:
    format:
      console: ecs

# Spring Boot 4.x 부터 OTLP 트레이싱 엔드포인트 프로퍼티가
# management.opentelemetry.tracing.export.otlp.* 로 이동했다(구 management.otlp.tracing.* 제거).
#
# Actuator 를 별도 관리 포트(9090)로 분리한다. 공개 HTTPRoute 가 8080 의 모든
# 경로(PathPrefix /)를 게이트웨이로 전달하므로, /actuator/prometheus 가 8080 에
# 있으면 인터넷에 그대로 노출된다. 9090 은 NetworkPolicy 로 observability 의
# Prometheus 파드에서만 접근 가능하다.
#
# 값들은 보안과 무관하므로 하드코딩한다. 긴급 차단(예: collector 장애로 export
# 끊고 싶을 때)이 필요하면 env 가 yml 을 이기는 relaxed binding 으로 충분하다 —
#   MANAGEMENT_TRACING_EXPORT_OTLP_ENABLED=false
management:
  server:
    port: 9090
  endpoints:
    web:
      exposure:
        include: health,prometheus
  tracing:
    export:
      otlp:
        enabled: true
  opentelemetry:
    tracing:
      export:
        otlp:
          endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/traces
    # OTLP logs — Logback 애펜더(OtelLoggingConfiguration)가 설치되어야 실제로
    # 흐른다. 수신처 otel-collector 는 Loki 의 네이티브 OTLP 엔드포인트로
    # 전달하며, SDK 가 trace_id/span_id 를 자동 부착한다.
    logging:
      export:
        otlp:
          endpoint: http://otel-collector.observability.svc.cluster.local:4318/v1/logs

aligner:
  web:
    cors:
      allowed-origins: http://localhost:5173,https://aligneryoga.com,https://www.aligneryoga.com
  auth:
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:https://www.aligneryoga.com/oauth/kakao}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
