# ==============================================================================
# 1. 공통 기본 설정 (Common Base Configuration)
# ==============================================================================
spring:
  application:
    name: aligner-server
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/aligner}
    username: ${DB_USERNAME:aligner}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog-master.yaml
    liquibase-schema: public

server:
  port: ${SERVER_PORT:8080}

aligner:
  auth:
    jwt:
      secret: ${JWT_SECRET}
      expiration-seconds: ${JWT_EXPIRATION_SECONDS:1209600}
      issuer: aligner
    kakao:
      token-uri: ${KAKAO_TOKEN_URI:https://kauth.kakao.com/oauth/token}
      user-info-uri: ${KAKAO_USER_INFO_URI:https://kapi.kakao.com/v2/user/me}
      client-id: ${KAKAO_CLIENT_ID}
      client-secret: ${KAKAO_CLIENT_SECRET}
      connect-timeout-millis: ${KAKAO_CONNECT_TIMEOUT_MILLIS:2000}
      read-timeout-millis: ${KAKAO_READ_TIMEOUT_MILLIS:3000}

---
# ==============================================================================
# 2. 개발 / 테스트 환경 프로필 (dev Profile - test.aligneryoga.com)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    team.aligner: DEBUG

aligner:
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://test.aligneryoga.com}
      max-age-seconds: 3600
  auth:
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:https://test.aligneryoga.com/oauth/kakao}

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
    tags-sorter: alpha
    operations-sorter: method

---
# ==============================================================================
# 3. 운영 환경 프로필 (prod Profile - api.aligneryoga.com)
# ==============================================================================
spring:
  config:
    activate:
      on-profile: prod

logging:
  level:
    team.aligner: INFO

aligner:
  web:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:https://aligneryoga.com,https://www.aligneryoga.com}
      max-age-seconds: 3600
  auth:
    kakao:
      redirect-uri: ${KAKAO_REDIRECT_URI:https://aligneryoga.com/oauth/kakao}

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:true}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:true}
    tags-sorter: alpha
    operations-sorter: method
