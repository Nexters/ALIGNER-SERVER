# training 도메인 changelog.
#
# changeset id 에 도메인 접두사를 붙인다. 도메인 5 개가 public.DATABASECHANGELOG 하나를
# 공유하므로 접두사가 없으면 번호가 겹친다 (docs/architecture.md §6).
#
# 이미 적용된 changeset 은 수정하지 않고 새로 쌓는다.
databaseChangeLog:
  - changeSet:
      id: training-0001-create-schema
      author: aligner
      comment: training 스키마 생성
      changes:
        - sql:
            sql: CREATE SCHEMA IF NOT EXISTS training

  - changeSet:
      id: training-0002-create-session
      author: aligner
      comment: 세션 테이블 생성
      changes:
        - sqlFile:
            path: ddl/001-create-session.sql
            relativeToChangelogFile: true

  - changeSet:
      id: training-0003-create-session-exercise-record
      author: aligner
      comment: 세션 운동 수행 기록 테이블 생성
      changes:
        - sqlFile:
            path: ddl/002-create-session-exercise-record.sql
            relativeToChangelogFile: true

  - changeSet:
      id: training-0004-add-session-report
      author: aligner
      comment: 세션에 소모 칼로리와 핀포즈 직후 체감 추가
      changes:
        - sqlFile:
            path: ddl/003-add-session-report.sql
            relativeToChangelogFile: true
